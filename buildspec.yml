version: 0.2
env:
  secrets-manager:
    DOCKER_USERNAME: "docker-hub-credentials:username"
    DOCKER_PASSWORD: "docker-hub-credentials:password"
  variables:
    IMAGE_REPO_NAME: "avihayr/terraform-wp-multi-az-deployment"
    IMAGE_TAG: "latest"
    SECONDARY_REPO_BRANCH: "main"
    WP_CONTENT_PATH: "wp-content" 
    SQL_DUMP_PATH: "wp-blog/sql/wp-db-backup.sql"
    DB_NAME: "wordpress"
    DB_PORT: "3306"
    APP_PORT: "8080"
  # *IMPORTANT* Supply sensitive values via your build environment and secrets manager:
  #   [DOCKERHUB_USERNAME ,DOCKERHUB_PASSWORD ,SECONDARY_REPO_URL, DB_USER, DB_PASSWORD, DB_ROOT_PASSWORD]

phases:
  install:
    commands:
      - echo "Install phase - Ensuring basics are available"
      - docker --version
      - git --version
      - sudo yum install -y yum-utils shadow-utils
      - sudo yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - sudo yum install -y terraform
      - terraform version
  pre_build:
    commands:
      - echo "Pre-build phase - cloning secondary repo for SQL dump"
      - |
        if [ -n "${SECONDARY_REPO_URL}" ]; then
          git clone --depth 1 --branch "${SECONDARY_REPO_BRANCH}" "${SECONDARY_REPO_URL}" wp-blog-content
          SQL_DUMP_LOCAL="$(pwd)/wp-blog-content/${SQL_DUMP_PATH}"
          echo "SQL_DUMP_LOCAL=${SQL_DUMP_LOCAL}" | tee -a $CODEBUILD_SRC_DIR/.env
        else
          echo "SECONDARY_REPO_URL not set. Skipping SQL clone."
        fi
  build:
    commands:
      - echo "Authenticating on DockerHub"
      - |
        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
          echo "Docker Hub credentials found, logging in..."
          echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
        else
          echo "No Docker Hub credentials provided, skipping login..."
        fi
        
      - echo "Building the Docker image from Dockerfile..."
      - |
        docker build \
          --build-arg SECONDARY_REPO_URL="${SECONDARY_REPO_URL}" \
          --build-arg SECONDARY_REPO_BRANCH="${SECONDARY_REPO_BRANCH}" \
          --build-arg WP_CONTENT_PATH="${WP_CONTENT_PATH}" \
          -t ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} \
          -f Dockerfile .
  post_build:
    commands:
      - echo "Post-build phase - running security scan and functional tests"
      - echo "Scanning image with Trivy..."
      - |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image --exit-code 1 --severity CRITICAL \
          ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} || {
            echo "Trivy detected high/critical vulnerabilities"; exit 1; }
      # -------------------- Experimental steps ---------------------------- #

      - echo "Running Docker Container..."
      - docker run --rm -d --name local-wp -p 8080:80 ${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION}

      - echo "Verify wp-content was transferred"
      - docker exec local-wp ls /var/www/html/wp-content/uploads/2025/06
      
      - echo "Verify Wordpress is running"
      - sleep 30
      - curl -L http://localhost:8080
      # --------------------------------------------------------------------- #

      # Infra Provisioning
      - echo "Provisioning infrastructure in AWS..."
      - |
        terraform init \
          -backend-config="bucket=${TF_BACKEND_BUCKET}" \
          -backend-config="region=${TF_BACKEND_REGION}" \
          -backend-config="key=${TF_BACKEND_KEY}"

      - terraform plan -var="db_username=${DB_USER}" -var="db_username=${DB_PASSWORD}" -out=tfplan
      - terraform apply -auto-approve tfplan
      