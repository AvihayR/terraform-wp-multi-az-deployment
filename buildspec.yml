version: 0.2
env:
  secrets-manager:
    DOCKER_USERNAME: "docker-hub-credentials:username"
    DOCKER_PASSWORD: "docker-hub-credentials:password"
  variables:
    IMAGE_REPO_NAME: "terraform-wp-multi-az-deployment"
    IMAGE_TAG: "latest"
    SECONDARY_REPO_BRANCH: "main"
    WP_CONTENT_PATH: "wp-blog/wp-content" 
    SQL_DUMP_PATH: "wp-blog/sql/wp-db-backup.sql"
    DB_NAME: "wordpress"
    DB_PORT: "3306"
    APP_PORT: "8080"
  
  # *IMPORTANT* Supply sensitive values via your build environment and secrets manager
  #   SECONDARY_REPO_URL: "" 
  #   DB_USER: ""
  #   DB_PASSWORD: ""
  #   DB_ROOT_PASSWORD: ""


phases:
  install:
    commands:
      - echo "Install phase - Ensuring basics are available"
      - docker --version
      - git --version
  pre_build:
    commands:
      - echo "Pre-build phase - cloning secondary repo for SQL dump"
      - |
        if [ -n "${SECONDARY_REPO_URL}" ]; then
          git clone --depth 1 --branch "${SECONDARY_REPO_BRANCH}" "${SECONDARY_REPO_URL}" wp-blog-content
          SQL_DUMP_LOCAL="$(pwd)/wp-blog-content/${SQL_DUMP_PATH}"
          echo "SQL_DUMP_LOCAL=${SQL_DUMP_LOCAL}" | tee -a $CODEBUILD_SRC_DIR/.env
        else
          echo "SECONDARY_REPO_URL not set. Skipping SQL clone."
        fi
  build:
    commands:
      - echo "Building the Docker image from Dockerfile..."
      - |
        docker build \
          --build-arg SECONDARY_REPO_URL="${SECONDARY_REPO_URL}" \
          --build-arg SECONDARY_REPO_BRANCH="${SECONDARY_REPO_BRANCH}" \
          --build-arg WP_CONTENT_PATH="${WP_CONTENT_PATH}" \
          -t avihayr/${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} \
          -f Dockerfile .
  post_build:
    commands:
      - echo "Post-build phase - running security scan and functional tests"
      - echo "Scanning image with Trivy..."
      - |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
          avihayr/${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION} || {
            echo "Trivy detected high/critical vulnerabilities"; exit 1; }
      # -------------------- Experimental steps ---------------------------- #

      - echo "Listing docker images"
      - docker images

      - echo "Running Docker Container..."
      - docker run --rm -d /var/run/docker.sock:/var/run/docker.sock \
        --name local-wp -p 8080:80 avihayr/${IMAGE_REPO_NAME}:${CODEBUILD_RESOLVED_SOURCE_VERSION}
      
      - echo "List all env vars on container"
      - docker exec local-wp env

      - echo "Verify wp-content was transferred"
      - docker exec local-wp ls /var/www/html/wp-content/uploads/2025/06
